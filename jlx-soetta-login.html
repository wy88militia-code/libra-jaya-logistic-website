<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Operasional Soetta | JL Express</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f7;color:#10243d;font-family:Inter,system-ui,-apple-system,sans-serif;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid #dbe5ee;border-radius:20px;padding:24px;box-shadow:0 14px 40px #18365012}.brand{background:#061d36;color:#fff;border-radius:15px;padding:18px;margin-bottom:20px}.brand small{display:block;color:#b9cce0;margin-top:4px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:#0b5c9c}.field{display:grid;gap:5px;margin:12px 0}label{font-size:12px;font-weight:800}input{width:100%;padding:12px;border:1px solid #c9d7e4;border-radius:10px;font:inherit}button{width:100%;padding:12px;border:0;border-radius:10px;background:#0b5c9c;color:#fff;font:inherit;font-weight:900;margin-top:8px}button:disabled{opacity:.55}.status{min-height:20px;color:#b42318;font-size:12px;margin:10px 0 0}.note{background:#f5f8fa;border-radius:10px;padding:10px;font-size:11px;color:#607488;line-height:1.45;margin-top:15px}.back{display:block;text-align:center;margin-top:15px;color:#46647e;text-decoration:none;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><strong>JL EXPRESS</strong><small>Operasional Hub Soetta</small></div>
    <p class="eyebrow">AKSES PETUGAS SOETTA</p>
    <h1>Masuk Operasional</h1>
    <p>Pesanan, pickup, gudang transit, timbang, faktur, SMU dan PTI.</p>
    <form id="jlx-login-form">
      <div class="field"><label for="jlx-user">Username</label><input id="jlx-user" autocomplete="username" maxlength="80" required autofocus></div>
      <div class="field"><label for="jlx-pin">PIN</label><input id="jlx-pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" maxlength="12" required></div>
      <div class="field"><label for="jlx-otp">OTP 6 digit <span style="font-weight:400">(jika aktif)</span></label><input id="jlx-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div>
      <button type="submit">Masuk JL Express Soetta</button>
      <p class="status" id="jlx-status" role="alert" aria-live="polite"></p>
    </form>
    <div class="note">Akun role <b>OPS</b> masuk langsung ke backend Soetta. <b>SUPERADMIN</b> juga boleh masuk untuk pemeriksaan dan pengawasan.</div>
    <a class="back" href="/">← Website</a>
  </main>
  <script src="/jlx-soetta-login.js"></script>
</body>
</html>
