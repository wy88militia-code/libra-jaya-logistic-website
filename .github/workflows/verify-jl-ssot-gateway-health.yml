name: Verify JL SSOT Gateway Health
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-jl-ssot-gateway-health.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check gateway health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL https://librajayalogistic.com/.netlify/functions/jl-master-gateway-health)"
          echo "$BODY"
          BODY="$BODY" python - <<'PY'
          import json,os
          d=json.loads(os.environ["BODY"])
          assert d.get("configured") is True, d
          assert d.get("ok") is True, d
          assert d.get("source")=="GOOGLE_SHEET_GATEWAY", d
          assert int(d.get("configRows") or 0)>0, d
          print("LIBRA_GATEWAY_HEALTH_OK")
          PY
