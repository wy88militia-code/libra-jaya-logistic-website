name: Netlify Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: 7bf7a503-fb4a-4222-b028-6fcf32096ed0
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require Netlify auth token
        shell: bash
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "Missing GitHub Actions secret NETLIFY_AUTH_TOKEN"
            exit 1
          fi

      - name: Install project dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Apply temporary syntax hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/admin-phase1-accurate-si-uat.mjs')
          s = p.read_text()
          s = s.replace('`ACCURATE_NATIVE_SI_UAT_*`', 'ACCURATE_NATIVE_SI_UAT_*')
          p.write_text(s)
          PY

      - name: Deploy current main to Netlify production
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --build \
            --prod \
            --site "${NETLIFY_SITE_ID}" \
            --auth "${NETLIFY_AUTH_TOKEN}"

      - name: Verify production commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 15 https://librajayalogistic.com/health/release || true)"
            deployed_sha="$(printf '%s' "${body}" | jq -r '.commitRef // empty' 2>/dev/null || true)"
            echo "Attempt ${attempt}/30 • deployed=${deployed_sha:-unavailable}"
            if [ "${deployed_sha}" = "${EXPECTED_SHA}" ]; then
              echo "Production deploy verified."
              exit 0
            fi
            sleep 10
          done
          echo "Production commit did not match ${EXPECTED_SHA}."
          exit 1

      - name: Herly Accurate read-only test
        if: contains(github.event.head_commit.message, 'Run Herly read test')
        shell: bash
        run: |
          set -euo pipefail
          key="$(npx --yes netlify-cli@latest env:get HERLY_TEST_KEY --context production --site "${NETLIFY_SITE_ID}" --auth "${NETLIFY_AUTH_TOKEN}" | tail -n 1 | tr -d '\r\n')"
          if [ -z "${key}" ]; then
            echo "HERLY_TEST_KEY unavailable"
            exit 1
          fi
          response="$(curl -fsS --max-time 60 --get --data-urlencode "key=${key}" https://librajayalogistic.com/internal/accurate-herly-read-test-7f4c2a91)"
          printf '%s\n' "${response}" | jq .
