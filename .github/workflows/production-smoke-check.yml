name: Production Smoke Check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Syntax check critical production modules
        shell: bash
        run: |
          set -euo pipefail
          node --check netlify/functions/_jl-master-core.mjs
          node --check netlify/functions/_karantina-core.mjs
          node --check netlify/functions/public-karantina-screen.mjs
          node --check netlify/functions/_phase1-final-pricing-core.mjs
          node --check netlify/functions/_backup-core.mjs
          node --check netlify/functions/_api-auth.mjs

      - name: Unit test Karantina screening guard
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { screenKarantinaFromRules } from './netlify/functions/_karantina-core.mjs';
          const rules=[
            {RULE_ID:'KAR-ANM-001',DOMAIN:'HEWAN','KOMODITAS / KEYWORD':'daging, telur, susu, kulit hewan, tulang, madu, produk hewan','ASAL_SCOPE':'Antardaerah / antarpulau','TUJUAN_SCOPE':'Semua tujuan',STATUS_SCREENING:'WAJIB CEK KARANTINA',PRIORITAS:'HIGH',TERAKHIR_DICEK:'2026-09-05'},
            {RULE_ID:'KAR-PAP-001',DOMAIN:'HEWAN-PAPUA','KOMODITAS / KEYWORD':'daging kerbau/sapi/ruminansia dan produk berisiko PMK','ASAL_SCOPE':'Luar Papua, termasuk Sulawesi Selatan/Jawa dan wilayah lain','TUJUAN_SCOPE':'Papua / Jayapura / Sentani',STATUS_SCREENING:'RESTRICTED - WAJIB VERIFIKASI UPT',PRIORITAS:'CRITICAL',TERAKHIR_DICEK:'2026-09-05'},
            {RULE_ID:'KAR-FSH-001',DOMAIN:'IKAN','KOMODITAS / KEYWORD':'ikan, udang, kepiting, lobster, seafood','ASAL_SCOPE':'Antardaerah / antarpulau','TUJUAN_SCOPE':'Semua tujuan',STATUS_SCREENING:'WAJIB CEK KARANTINA',PRIORITAS:'HIGH',TERAKHIR_DICEK:'2026-09-05'},
            {RULE_ID:'KAR-OPS-001',DOMAIN:'INTERNAL-JLX','KOMODITAS / KEYWORD':'Semua komoditas karantina / aturan dinamis',STATUS_SCREENING:'FRESHNESS CHECK',PRIORITAS:'CRITICAL',TERAKHIR_DICEK:'2026-09-05'}
          ];
          const meat=screenKarantinaFromRules({commodity:'Daging sapi',cargoType:'FRESH',origin:'Jakarta',destination:'Jayapura Papua'},rules);
          if(meat.classification!=='KARANTINA_HEWAN'||!meat.requiresReview||!meat.holdRequired||!meat.matchedRules.some(r=>r.ruleId==='KAR-PAP-001'))throw new Error(`Daging sapi screening gagal: ${JSON.stringify(meat)}`);
          const fish=screenKarantinaFromRules({commodity:'Ikan frozen',cargoType:'FROZEN',origin:'Jakarta',destination:'Jayapura'},rules);
          if(fish.classification!=='KARANTINA_IKAN'||!fish.requiresReview)throw new Error(`Ikan screening gagal: ${JSON.stringify(fish)}`);
          const general=screenKarantinaFromRules({commodity:'Barang elektronik',cargoType:'GENERAL',origin:'Jakarta',destination:'Jayapura'},rules);
          if(general.requiresReview||general.classification!=='NONE')throw new Error(`False positive general cargo: ${JSON.stringify(general)}`);
          console.log('Karantina guard tests PASS');
          NODE

      - name: Wait for Netlify production release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://librajayalogistic.com/health/release
        run: |
          set -u
          echo "Waiting for Netlify production commit: ${EXPECTED_SHA}"
          for attempt in $(seq 1 48); do
            body="$(curl -fsS --max-time 15 "${RELEASE_URL}" 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "${body}" | jq -r '.commitRef // empty' 2>/dev/null || true)"
            release_version="$(printf '%s' "${body}" | jq -r '.releaseVersion // empty' 2>/dev/null || true)"
            echo "Attempt ${attempt}/48 • deployed=${deployed_sha:-unavailable} • release=${release_version:-unavailable}"
            if [ "${deployed_sha}" = "${EXPECTED_SHA}" ]; then
              echo "Production is running the expected commit."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach expected commit within 8 minutes."
          exit 1

      - name: Smoke test protected admin panels
        shell: bash
        run: |
          set -euo pipefail
          for path in /admin-tool /admin-system-health /admin-maps-pilot /admin-master-sheet /admin-finance-billing /admin-consolidation /admin-audit-backup /admin-resilience; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://librajayalogistic.com${path}")"
            echo "${path} -> HTTP ${code}"
            case "${code}" in
              200|301|302|303|307|308) ;;
              *) echo "Unexpected HTTP status for ${path}"; exit 1 ;;
            esac
          done

      - name: Smoke test Karantina Master screening
        shell: bash
        run: |
          set -euo pipefail
          url='https://librajayalogistic.com/.netlify/functions/public-karantina-screen'
          body='{"commodity":"Daging sapi","cargoType":"FRESH","origin":"Jakarta","destination":"Jayapura Papua"}'
          response="$(curl -fsS --max-time 20 -H 'Origin: https://jlexpress.id' -H 'Content-Type: application/json' --data "${body}" "${url}")"
          echo "Karantina response: $(printf '%s' "${response}" | jq -c '{ok,status,classification,holdRequired,priority,matchedRules:[.matchedRules[]?.ruleId]}')"
          test "$(printf '%s' "${response}" | jq -r '.ok')" = 'true'
          test "$(printf '%s' "${response}" | jq -r '.classification')" = 'KARANTINA_HEWAN'
          test "$(printf '%s' "${response}" | jq -r '.requiresReview')" = 'true'
          test "$(printf '%s' "${response}" | jq -r '.holdRequired')" = 'true'
          printf '%s' "${response}" | jq -e '.matchedRules | any(.ruleId == "KAR-PAP-001")' >/dev/null

      - name: Reject foreign browser origin on Karantina endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/karantina-origin.json -w '%{http_code}' --max-time 15 -H 'Origin: https://example.invalid' -H 'Content-Type: application/json' --data '{"commodity":"Daging sapi","origin":"Jakarta","destination":"Jayapura"}' 'https://librajayalogistic.com/.netlify/functions/public-karantina-screen')"
          echo "Foreign origin -> HTTP ${code}"
          test "${code}" = '403'
