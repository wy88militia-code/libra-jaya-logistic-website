name: Production Smoke Check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Syntax check critical production modules
        shell: bash
        run: |
          set -euo pipefail
          # Shared Master + compliance
          node --check netlify/functions/_jl-master-core.mjs
          node --check netlify/functions/_karantina-core.mjs
          node --check netlify/functions/public-karantina-screen.mjs
          node --check netlify/functions/_admin-rbac-core.mjs
          node --check netlify/functions/_admin-audit-core.mjs

          # Phase 1 Soetta: booking -> weight -> pricing -> invoice draft
          node --check netlify/functions/_soetta-booking-core.mjs
          node --check netlify/functions/jlx-soetta-booking.mjs
          node --check netlify/functions/_weight-core.mjs
          node --check netlify/functions/_weight-approval-core.mjs
          node --check netlify/functions/_phase1-ptd-core.mjs
          node --check netlify/functions/_phase1-ptd-selftest-core.mjs
          node --check netlify/functions/_phase1-final-pricing-core.mjs
          node --check netlify/functions/_phase1-price-lock-core.mjs
          node --check netlify/functions/_phase1-invoice-draft-core.mjs
          node --check netlify/functions/jlx-soetta-pricing.mjs
          node --check netlify/functions/jlx-soetta-invoice.mjs
          node --check netlify/functions/admin-phase1-invoices.mjs

          # CGK -> DJJ -> shared DJJ last-mile -> POD
          node --check netlify/functions/_manifest-core.mjs
          node --check netlify/functions/_phase1-marketplace-core.mjs
          node --check netlify/functions/scheduled-phase1-marketplace.mjs
          node --check netlify/functions/_djj-lastmile-engine.mjs
          node --check netlify/functions/_djj-lastmile-queue-core.mjs
          node --check netlify/functions/_warehouse-core.mjs
          node --check netlify/functions/_tracking-core.mjs
          node --check netlify/functions/_courier-custody-core.mjs
          node --check netlify/functions/admin-lastmile-djj.mjs
          node --check netlify/functions/courier-lastmile-djj.mjs

          # Native Accurate Sales Invoice + anti-double settlement
          node --check netlify/functions/_accurate-native-si-core.mjs
          node --check netlify/functions/_accurate-native-si-uat-core.mjs
          node --check netlify/functions/_accurate-native-si-uat-readback-core.mjs
          node --check netlify/functions/_accurate-native-si-production-readiness-core.mjs
          node --check netlify/functions/_accurate-native-si-production-core.mjs
          node --check netlify/functions/_accurate-sales-invoice-verify-core.mjs
          node --check netlify/functions/_phase1-native-si-wallet-core.mjs
          node --check netlify/functions/_phase1-native-si-settlement-core.mjs
          node --check netlify/functions/admin-phase1-accurate-si-uat.mjs
          node --check netlify/functions/admin-phase1-accurate-si-production-readiness.mjs

          # Partner Deposit UAT bridge remains syntax-gated; production stays guarded.
          node --check netlify/functions/_accurate-partner-deposit-dp-uat-core.mjs
          node --check netlify/functions/admin-phase1-partner-deposit-dp-uat.mjs
          node --check netlify/functions/_accurate-partner-deposit-receipt-uat-core.mjs
          node --check netlify/functions/admin-phase1-partner-deposit-receipt-uat.mjs
          node --check netlify/functions/_accurate-partner-deposit-apply-uat-core.mjs
          node --check netlify/functions/admin-phase1-partner-deposit-apply-uat.mjs
          node --check netlify/functions/_accurate-partner-deposit-bridge-audit-core.mjs
          node --check netlify/functions/admin-phase1-partner-deposit-bridge.mjs

          # Resilience
          node --check netlify/functions/_backup-core.mjs
          node --check netlify/functions/admin-audit-recovery.mjs
          node --check netlify/functions/_api-auth.mjs

      - name: Unit test Phase 1 logistics guards
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            phase1CustomerChargeableKg,
            calculatePhase1PtpVendorBatchCost,
            resolveAirlinePtpCostPolicy,
            phase1LastmileHandlingPerUniqueSmu,
          } from './netlify/functions/_phase1-ptd-core.mjs';
          import {
            DJJ_LASTMILE_ENGINE,
            resolveDjjLastmileWeightBasis,
            isDjjLastmileRoute,
          } from './netlify/functions/_djj-lastmile-engine.mjs';

          if (phase1CustomerChargeableKg('PTD_CGK_DJJ_REGULAR', 3) !== 3) throw new Error('REGULAR 3kg must remain 3kg');
          if (phase1CustomerChargeableKg('PTD_CGK_DJJ_ONS', 3) !== 10) throw new Error('ONS 3kg must bill 10kg');
          if (phase1CustomerChargeableKg('PTD_CGK_DJJ_ONS', 12) !== 12) throw new Error('ONS 12kg must remain 12kg');

          const policy=resolveAirlinePtpCostPolicy({
            airlineId:'garuda-citilink',
            airlineName:'Garuda/Citilink',
            notes:'PTP ALL-IN termasuk RA + Gudang Keberangkatan',
            adminPerSmu:20000,
          });
          const vendor=calculatePhase1PtpVendorBatchCost({batchWeightKg:12,vendorMinKg:10,airlineRatePerKg:70225,policy});
          if (vendor.total !== 862700) throw new Error(`Garuda 12kg expected 862700, got ${vendor.total}`);
          if (vendor.components.find(x=>x.code==='CGK_RA')?.amount !== 0) throw new Error('Garuda all-in RA duplicated');
          if (vendor.components.find(x=>x.code==='CGK_WAREHOUSE_HANDLING')?.amount !== 0) throw new Error('Garuda all-in warehouse duplicated');
          if (phase1LastmileHandlingPerUniqueSmu() !== 25000) throw new Error('Unique-SMU incoming handling must be 25000');

          if (DJJ_LASTMILE_ENGINE.id !== 'DJJ_LASTMILE_V1') throw new Error('DJJ last-mile engine ID changed');
          if (!isDjjLastmileRoute({hub:'DJJ',moda:'DARAT'})) throw new Error('DJJ road route must be eligible');
          if (isDjjLastmileRoute({hub:'WMX',moda:'DARAT'})) throw new Error('WMX must not enter DJJ last-mile engine');
          const partnerBasis=resolveDjjLastmileWeightBasis({smuTotalWeightKg:8.5,weightKg:9.2},'PARTNER_API');
          if (partnerBasis.weightBasis !== 'PARTNER_PTI' || partnerBasis.basisWeightKg !== 8.5 || partnerBasis.sentaniPhysicalCheckMayRepriceCustomer !== false) throw new Error('Partner API PTI weight policy changed');
          const jlxBasis=resolveDjjLastmileWeightBasis({chargeableWeightKg:12,weightKg:11.4},'JLX_INTERNAL');
          if (jlxBasis.basisWeightKg !== 12 || jlxBasis.sentaniPhysicalCheckMayRepriceCustomer !== false) throw new Error('JLX upstream final-weight policy changed');

          console.log('Phase 1 logistics guards PASS');
          NODE

      - name: Unit test Karantina screening guard
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { screenKarantinaFromRules } from './netlify/functions/_karantina-core.mjs';
          const rules=[
            {RULE_ID:'KAR-ANM-001',DOMAIN:'HEWAN','KOMODITAS / KEYWORD':'daging, telur, susu, kulit hewan, tulang, madu, produk hewan','ASAL_SCOPE':'Antardaerah / antarpulau','TUJUAN_SCOPE':'Semua tujuan',STATUS_SCREENING:'WAJIB CEK KARANTINA',PRIORITAS:'HIGH',TERAKHIR_DICEK:'2026-09-05'},
            {RULE_ID:'KAR-PAP-001',DOMAIN:'HEWAN-PAPUA','KOMODITAS / KEYWORD':'daging kerbau/sapi/ruminansia dan produk berisiko PMK','ASAL_SCOPE':'Luar Papua, termasuk Sulawesi Selatan/Jawa dan wilayah lain','TUJUAN_SCOPE':'Papua / Jayapura / Sentani',STATUS_SCREENING:'RESTRICTED - WAJIB VERIFIKASI UPT',PRIORITAS:'CRITICAL',TERAKHIR_DICEK:'2026-09-05'},
            {RULE_ID:'KAR-FSH-001',DOMAIN:'IKAN','KOMODITAS / KEYWORD':'ikan, udang, kepiting, lobster, seafood','ASAL_SCOPE':'Antardaerah / antarpulau','TUJUAN_SCOPE':'Semua tujuan',STATUS_SCREENING:'WAJIB CEK KARANTINA',PRIORITAS:'HIGH',TERAKHIR_DICEK:'2026-09-05'},
            {RULE_ID:'KAR-OPS-001',DOMAIN:'INTERNAL-JLX','KOMODITAS / KEYWORD':'Semua komoditas karantina / aturan dinamis',STATUS_SCREENING:'FRESHNESS CHECK',PRIORITAS:'CRITICAL',TERAKHIR_DICEK:'2026-09-05'}
          ];
          const meat=screenKarantinaFromRules({commodity:'Daging sapi',cargoType:'FRESH',origin:'Jakarta',destination:'Jayapura Papua'},rules);
          if(meat.classification!=='KARANTINA_HEWAN'||!meat.requiresReview||!meat.holdRequired||!meat.matchedRules.some(r=>r.ruleId==='KAR-PAP-001'))throw new Error(`Daging sapi screening gagal: ${JSON.stringify(meat)}`);
          const fish=screenKarantinaFromRules({commodity:'Ikan frozen',cargoType:'FROZEN',origin:'Jakarta',destination:'Jayapura'},rules);
          if(fish.classification!=='KARANTINA_IKAN'||!fish.requiresReview)throw new Error(`Ikan screening gagal: ${JSON.stringify(fish)}`);
          const general=screenKarantinaFromRules({commodity:'Barang elektronik',cargoType:'GENERAL',origin:'Jakarta',destination:'Jayapura'},rules);
          if(general.requiresReview||general.classification!=='NONE')throw new Error(`False positive general cargo: ${JSON.stringify(general)}`);
          console.log('Karantina guard tests PASS');
          NODE

      - name: Wait for Netlify production release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://librajayalogistic.com/health/release
        run: |
          set -u
          echo "Waiting for Netlify production commit: ${EXPECTED_SHA}"
          for attempt in $(seq 1 48); do
            body="$(curl -fsS --max-time 15 "${RELEASE_URL}" 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "${body}" | jq -r '.commitRef // empty' 2>/dev/null || true)"
            release_version="$(printf '%s' "${body}" | jq -r '.releaseVersion // empty' 2>/dev/null || true)"
            echo "Attempt ${attempt}/48 • deployed=${deployed_sha:-unavailable} • release=${release_version:-unavailable}"
            if [ "${deployed_sha}" = "${EXPECTED_SHA}" ]; then
              echo "Production is running the expected commit."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach expected commit within 8 minutes."
          exit 1

      - name: Smoke test protected Phase 1 panels
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /jlx-soetta \
            /jlx-soetta/booking \
            /admin-phase1-ptd-check \
            /admin-lastmile-djj \
            /courier/lastmile-djj \
            /admin-phase1-invoices \
            /admin-phase1-accurate-si-uat \
            /admin-phase1-accurate-si-production-readiness \
            /admin-phase1-partner-deposit-dp-uat \
            /admin-phase1-partner-deposit-receipt-uat \
            /admin-phase1-partner-deposit-apply-uat \
            /admin-tool \
            /admin-system-health \
            /admin-master-sheet \
            /admin-finance-billing; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://librajayalogistic.com${path}")"
            echo "${path} -> HTTP ${code}"
            case "${code}" in
              200|301|302|303|307|308) ;;
              *) echo "Unexpected HTTP status for ${path}"; exit 1 ;;
            esac
          done

      - name: Smoke test Karantina Master screening
        shell: bash
        run: |
          set -euo pipefail
          url='https://librajayalogistic.com/.netlify/functions/public-karantina-screen'
          body='{"commodity":"Daging sapi","cargoType":"FRESH","origin":"Jakarta","destination":"Jayapura Papua"}'
          response="$(curl -fsS --max-time 20 -H 'Origin: https://jlexpress.id' -H 'Content-Type: application/json' --data "${body}" "${url}")"
          echo "Karantina response: $(printf '%s' "${response}" | jq -c '{ok,status,classification,holdRequired,priority,matchedRules:[.matchedRules[]?.ruleId]}')"
          test "$(printf '%s' "${response}" | jq -r '.ok')" = 'true'
          test "$(printf '%s' "${response}" | jq -r '.classification')" = 'KARANTINA_HEWAN'
          test "$(printf '%s' "${response}" | jq -r '.requiresReview')" = 'true'
          test "$(printf '%s' "${response}" | jq -r '.holdRequired')" = 'true'
          printf '%s' "${response}" | jq -e '.matchedRules | any(.ruleId == "KAR-PAP-001")' >/dev/null

      - name: Reject foreign browser origin on Karantina endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/karantina-origin.json -w '%{http_code}' --max-time 15 -H 'Origin: https://example.invalid' -H 'Content-Type: application/json' --data '{"commodity":"Daging sapi","origin":"Jakarta","destination":"Jayapura"}' 'https://librajayalogistic.com/.netlify/functions/public-karantina-screen')"
          echo "Foreign origin -> HTTP ${code}"
          test "${code}" = '403'
