<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Billing Statement | Libra Partner</title><link rel="stylesheet" href="portal.css"><style>.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid #dce6ef;border-radius:14px;padding:15px}.stat small{display:block;color:#718397}.stat strong{display:block;font-size:19px;margin-top:5px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar label{display:grid;gap:5px}.tablewrap{overflow:auto}.tablewrap table{width:100%;min-width:900px;border-collapse:collapse;font-size:12px}.tablewrap th,.tablewrap td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}.tablewrap th{background:#f7fafc}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf2f6;font-size:10px;font-weight:800}.amount{font-weight:900}.credit{color:#176b37}.muted2{font-size:11px;color:#718397}.warn{background:#fff8dc;border:1px solid #ecd486;padding:12px;border-radius:10px}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.summary{grid-template-columns:1fr}}@media print{header,.toolbar,.no-print{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.hero{background:#fff!important;color:#10243d!important;padding:0}.card,.stat{box-shadow:none}.tablewrap{overflow:visible}.tablewrap table{min-width:0;font-size:9px}}</style></head><body><header class="top"><div class="topin"><div class="brand"><strong>LIBRA JAYA LOGISTIC</strong><span>Billing Statement Partner</span></div><a href="/partner/">← Portal Partner</a></div></header><main class="wrap"><section class="hero"><h1 id="title">Billing Statement</h1><p id="subtitle">Memuat…</p></section><section class="card toolbar no-print"><label>Periode<input id="month" type="month"></label><button id="load">Tampilkan</button><a id="csv" class="btn secondary" href="#">Export CSV</a><button id="print" class="secondary">Cetak / Simpan PDF</button><a class="btn secondary" href="/partner/history.html">History & Rekonsiliasi</a></section><div id="error" class="status err"></div><div id="notice"></div><section class="summary"><div class="stat"><small>Service Charge</small><strong id="service">—</strong></div><div class="stat"><small>Adjustment Net</small><strong id="adjustment">—</strong></div><div class="stat"><small>Claim Settlement</small><strong id="claim">—</strong></div><div class="stat"><small>Net Charges</small><strong id="net">—</strong></div><div class="stat"><small>Outstanding</small><strong id="outstanding">—</strong></div><div class="stat"><small>Aging</small><strong id="aging">—</strong></div><div class="stat"><small>Deposit Masuk</small><strong id="deposit">—</strong></div><div class="stat"><small>Saldo Deposit</small><strong id="balance">—</strong></div></section><section class="card"><div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Jenis</th><th>Reference</th><th>Booking</th><th>Keterangan</th><th>Nilai</th></tr></thead><tbody id="rows"><tr><td colspan="6">Memuat…</td></tr></tbody></table></div></section></main><script>const $=id=>document.getElementById(id);const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleString('id-ID',{timeZone:'Asia/Jayapura'})+' WIT':'—';function currentMonth(){const d=new Date(Date.now()+9*3600000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');}async function load(){const month=$('month').value||currentMonth();$('month').value=month;$('csv').href='/.netlify/functions/partner-billing?month='+encodeURIComponent(month)+'&format=csv';$('error').className='status err';try{const r=await fetch('/.netlify/functions/partner-billing?month='+encodeURIComponent(month),{cache:'no-store'});if(r.status===401){location.href='/partner/login.html?next=/partner/billing.html';return;}const d=await r.json();if(!r.ok)throw new Error(d.message||'Billing gagal dimuat.');$('title').textContent='Billing '+d.partner.companyName;$('subtitle').textContent=d.partner.partnerId+' • '+d.period.month+' • '+(d.issued?'Issued '+(d.statement.statementNo||''):'Live Preview')+' • WIT';const s=d.summary;$('service').textContent=rp(s.serviceCharge);$('adjustment').textContent=rp(s.adjustmentNet);$('claim').textContent=rp(s.claimSettlements);$('net').textContent=rp(s.netCharges);$('outstanding').textContent=rp(s.outstanding);$('aging').textContent=s.agingBucket;$('deposit').textContent=rp(s.depositCredits);$('balance').textContent=rp(s.currentWalletBalance);$('notice').innerHTML=d.issued?'<div class="warn">Statement ini adalah snapshot yang sudah diterbitkan Finance Libra. Ringkasan saldo paling baru tetap tersedia pada portal wallet/history.</div>':'';$('rows').innerHTML=d.lines.length?d.lines.map(x=>'<tr><td>'+esc(fmt(x.createdAt))+'</td><td><span class="tag">'+esc(x.type)+'</span></td><td>'+esc(x.reference||'—')+'</td><td>'+esc(x.bookingId||'—')+'</td><td>'+esc(x.description||'')+'</td><td class="amount '+(Number(x.amount)<0?'credit':'')+'">'+esc(rp(x.amount))+'</td></tr>').join(''):'<tr><td colspan="6">Belum ada transaksi billing.</td></tr>';}catch(e){$('error').textContent=e.message;$('error').className='status show err';}}$('load').onclick=load;$('print').onclick=()=>window.print();load();</script></body></html>
