<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Login Partner Libra</title><link rel="stylesheet" href="wallet.css"></head><body><main class="login-shell"><section class="card login-card"><div class="brand">LIBRA JAYA LOGISTIC</div><h1>Portal Partner</h1><p>Masuk menggunakan Partner ID dan PIN yang diberikan Admin Libra.</p><form id="loginForm"><label>Partner ID<input id="partnerId" autocomplete="username" required></label><label>PIN 6 digit<input id="pin" inputmode="numeric" autocomplete="current-password" maxlength="6" pattern="[0-9]{6}" required></label><button type="submit">Masuk</button><p id="message" class="message"></p></form><p><a href="/partner/">← Pilihan layanan partner</a></p></section></main><script>const requested=new URLSearchParams(location.search).get('next')||'/partner/wallet.html';const next=requested.startsWith('/partner/')&&!requested.startsWith('//')?requested:'/partner/wallet.html';document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const message=document.getElementById('message');message.textContent='Memeriksa...';const res=await fetch('/.netlify/functions/partner-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({partnerId:document.getElementById('partnerId').value,pin:document.getElementById('pin').value})});const data=await res.json().catch(()=>({}));if(!res.ok){message.textContent=data.message||'Login gagal.';return;}location.href=next;});</script></body></html>
