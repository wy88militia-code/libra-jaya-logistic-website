[build]
  command = "node scripts/stamp-release.mjs"
  publish = "."

[[redirects]]
  from = "/partner/manual-booking"
  to = "/partner/login.html?next=/partner/booking.html"
  status = 302

[[redirects]]
  from = "/partner/api-onboarding"
  to = "/partner/api-onboarding.html"
  status = 200

[[redirects]]
  from = "/partner/activate"
  to = "/partner/activate.html"
  status = 200

[[redirects]]
  from = "/partner/api-dashboard"
  to = "/partner/api-dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/partner/activate*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/partner/api-dashboard*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Booking partner membutuhkan GPS tujuan untuk mengunci lokasi/kelurahan.
[[headers]]
  for = "/partner/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"

# Backend kurir menggunakan GPS dan kamera untuk POD.
[[headers]]
  for = "/admin-courier*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"
