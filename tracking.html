<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Lacak kiriman Libra Jaya Logistic"><title>Tracking Kiriman | Libra Jaya Logistic</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f3f6f9;color:#10243d}.top{background:#061d36;color:#fff;padding:18px}.topin{max-width:900px;margin:auto;display:flex;justify-content:space-between;gap:16px}.top a{color:#fff}.wrap{max-width:900px;margin:auto;padding:34px 16px 60px}.hero{background:#fff;border:1px solid #dbe5ee;border-radius:20px;padding:24px}.search{display:flex;gap:10px;margin-top:16px}.search input{flex:1;padding:13px;border:1px solid #bccbd9;border-radius:10px;font:inherit;text-transform:uppercase}.search button{padding:13px 18px;border:0;border-radius:10px;background:#ef312b;color:#fff;font-weight:900}.result{margin-top:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#fff;border:1px solid #dbe5ee;border-radius:14px;padding:14px}.box b{display:block;font-size:11px;color:#708296;text-transform:uppercase;margin-bottom:5px}.timeline{margin-top:14px;background:#fff;border:1px solid #dbe5ee;border-radius:16px;padding:18px}.event{position:relative;padding:0 0 20px 26px;border-left:2px solid #d8e4ee}.event:last-child{padding-bottom:0}.event:before{content:'';position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:#0b5c9c}.event strong{display:block}.event small{color:#718397}.msg{padding:13px;border-radius:10px;background:#fff0ef}.ok{background:#e8f5ec}.privacy{font-size:12px;color:#718397;margin-top:16px}@media(max-width:650px){.search{flex-direction:column}.summary{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="topin"><strong>LIBRA JAYA LOGISTIC</strong><a href="/">Home</a></div></header><main class="wrap"><section class="hero"><h1>Lacak Kiriman</h1><p>Masukkan nomor Booking/AWB Libra untuk melihat perjalanan kiriman.</p><form class="search" id="form"><input id="code" required autocomplete="off" placeholder="Contoh: LBR-..." aria-label="Nomor Booking atau AWB"><button>Lacak</button></form><div class="privacy">Halaman publik hanya menampilkan status operasional dan area tujuan. Nama penerima, nomor telepon, koordinat detail, serta foto POD tidak ditampilkan.</div></section><div class="result" id="result"></div></main><script>const form=document.getElementById('form'),code=document.getElementById('code'),result=document.getElementById('result');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('id-ID',{timeZone:'Asia/Jayapura'}):'-';form.addEventListener('submit',async e=>{e.preventDefault();result.innerHTML='<div class="msg ok">Mencari kiriman...</div>';try{const r=await fetch('/public-tracking-data?booking_id='+encodeURIComponent(code.value.trim()),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Kiriman tidak ditemukan.');const s=d.shipment,loc=[s.destination?.kelurahan,s.destination?.distrik,s.destination?.kabupaten].filter(Boolean).join(', ')||'-';result.innerHTML='<div class="summary"><div class="box"><b>Status</b>'+esc(s.status)+'</div><div class="box"><b>Tujuan</b>'+esc(loc)+'</div><div class="box"><b>Integritas Tracking</b>'+(d.integrity?.ok?'Terverifikasi':'Perlu review')+'</div></div><div class="timeline">'+(d.events||[]).slice().reverse().map(x=>'<div class="event"><strong>'+esc(x.status)+'</strong><small>'+esc(dt(x.created_at))+'</small>'+(x.note?'<p>'+esc(x.note)+'</p>':'')+(x.status==='DELIVERED'&&x.destination_distance_meters!=null?'<small>POD tercatat • '+esc(x.destination_distance_meters)+' m dari titik tujuan</small>':'')+'</div>').join('')+'</div>';}catch(err){result.innerHTML='<div class="msg">'+esc(err.message||'Tracking gagal dimuat.')+'</div>';}});const q=new URLSearchParams(location.search).get('awb');if(q){code.value=q;form.requestSubmit();}</script></body></html>
