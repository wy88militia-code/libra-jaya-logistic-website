<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Tool | PT Libra Jaya Logistic</title>
  <link rel="icon" type="image/webp" href="logo-libra-jaya.webp">
  <link rel="stylesheet" href="admin-login.css">
</head>
<body>
  <main class="login-card">
    <img src="logo-libra-jaya.webp" alt="Logo PT Libra Jaya Logistic">
    <p class="eyebrow">AKSES TERBATAS</p>
    <h1>Admin Tool</h1>
    <p class="intro">Masukkan PIN admin untuk melanjutkan.</p>
    <form id="admin-login-form">
      <label for="admin-pin">PIN Admin</label>
      <input id="admin-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" maxlength="12" required autofocus>
      <button type="submit">Masuk Admin Tool</button>
      <p id="login-status" role="alert" aria-live="polite"></p>
    </form>
    <a class="back" href="/">← Kembali ke website</a>
  </main>
  <script src="admin-login.js"></script>
</body>
</html>
